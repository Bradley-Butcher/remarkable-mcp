[package]
name = "remarkable-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A focused, cloud-only MCP server for reMarkable"
license.workspace = true
repository.workspace = true

[workspace]
members = [".", "crates/remarkable-render"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Bradley-Butcher/remarkable-mcp"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
crc32c = "0.6"
directories = "6"
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lopdf = "0.38"
open = "5"
pdf-render = "1.0.0-beta.17"
remarkable-render = { path = "crates/remarkable-render" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
rmcp = { version = "2.2", features = ["server", "macros", "schemars", "transport-io"] }
schemars = { version = "1.2", features = ["chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny-skia = "0.12"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
